spring.datasource.url=jdbc:h2:mem:reconiq-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Tests build their own data, so the demo seeder stays off.
reconiq.seed.enabled=false
reconiq.report.email.enabled=false
