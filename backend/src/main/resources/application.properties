spring.application.name=reconiq-backend
server.port=${SERVER_PORT:8080}

# --- MySQL -------------------------------------------------------
# Never hardcode credentials in this file. Provide them through
# environment variables (see .env.example / README).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reconiq_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---------------------------------------------
# validate = Hibernate only checks that entities match schema.sql (it never changes tables)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- JSON --------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# --- File upload limits ------------------------------------------
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:10MB}

# --- CORS --------------------------------------------------------
reconiq.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- Demo data ---------------------------------------------------
# Creates a demo admin account (and sample data when the DB is empty).
# Disable this in production.
reconiq.seed.enabled=${SEED_ENABLED:true}
reconiq.seed.admin.employee-id=${SEED_ADMIN_EMPLOYEE_ID:ADMIN001}
reconiq.seed.admin.name=${SEED_ADMIN_NAME:ReconIQ Admin}
reconiq.seed.admin.email=${SEED_ADMIN_EMAIL:admin@reconiq.local}
reconiq.seed.admin.password=${SEED_ADMIN_PASSWORD:admin123}
reconiq.seed.demo-data=${SEED_DEMO_DATA:true}

# --- Email / SMTP -------------------------------------------------
# Gmail is the default, matching the original setup. Provide an app
# password in MAIL_PASS (never commit it). Any SMTP server works:
# override SPRING_MAIL_HOST / SPRING_MAIL_PORT as needed.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Report delivery ---------------------------------------------
# Emails are enabled by default; PDF delivery starts working as soon as
# MAIL_USER and MAIL_PASS are configured.
reconiq.report.email.enabled=${REPORT_EMAIL_ENABLED:true}
reconiq.report.email.to=${REPORT_EMAIL_TO:}

# --- Error handling ----------------------------------------------
server.error.include-message=never
server.error.include-stacktrace=never
