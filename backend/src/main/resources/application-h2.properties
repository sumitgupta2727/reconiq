# In-memory demo profile: no MySQL required.
# Start with: mvn -Ph2 spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:reconiq;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates the schema from the JPA entities in this profile.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Seed the demo account and sample dataset.
reconiq.seed.enabled=${SEED_ENABLED:true}
reconiq.seed.demo-data=${SEED_DEMO_DATA:true}

# H2 web console (handy while demoing): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
